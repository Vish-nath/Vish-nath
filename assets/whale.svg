<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-labelledby="whaleTitle whaleDesc">
  <title id="whaleTitle">Swimming Whale Animation</title>
  <desc id="whaleDesc">An animated cute whale swimming in the ocean with water spouting and rising bubbles.</desc>
  <defs>
    <linearGradient id="oceanBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#10233F"/>
    </linearGradient>
    <linearGradient id="whaleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <clipPath id="whaleFrame"><rect width="1000" height="200" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#whaleFrame)">
    <rect width="1000" height="200" fill="url(#oceanBg)"/>

    <!-- Background marine sparkles -->
    <g fill="#00D4FF" opacity="0.4">
      <circle cx="150" cy="40" r="1.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="350" cy="60" r="2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="35" r="1.5"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="50" r="2"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Rising Bubbles -->
    <g fill="none" stroke="#00D4FF" stroke-width="1.5" opacity="0.6">
      <circle cx="430" cy="110" r="4">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -80" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="438" cy="130" r="2.5">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -90" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="425" cy="140" r="3">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -70" dur="2.8s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Swimming Whale Group -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0; 0,8; 0,0" dur="4s" repeatCount="indefinite"/>

      <!-- Water Spout -->
      <g>
        <path d="M 450 75 Q 450 40 435 30 M 450 75 Q 450 40 465 30" fill="none" stroke="#00D4FF" stroke-width="3" stroke-linecap="round">
          <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Whale Body & Tail -->
      <g>
        <!-- Tail Fin with wag animation -->
        <g transform="translate(350, 95)">
          <path d="M 0 0 C -20 -15 -40 -30 -55 -25 C -45 -10 -35 0 -30 5 Z" fill="url(#whaleGrad)">
            <animateTransform attributeName="transform" type="rotate" values="-5,0,0; 10,0,0; -5,0,0" dur="2s" repeatCount="indefinite"/>
          </path>
        </g>

        <!-- Main Body -->
        <path d="M 350 95 C 380 70, 480 70, 530 95 C 570 115, 570 145, 530 155 C 470 170, 390 170, 350 145 C 330 135, 330 105, 350 95 Z" fill="url(#whaleGrad)"/>

        <!-- Underbelly / Plate lines -->
        <path d="M 420 150 Q 460 162 500 150" fill="none" stroke="#0A0F1F" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
        <path d="M 430 155 Q 465 165 490 155" fill="none" stroke="#0A0F1F" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>

        <!-- Pectoral Fin -->
        <g transform="translate(460, 135)">
          <path d="M 0 0 C -10 25, -20 40, -30 45 C -15 35, 5 15, 10 0 Z" fill="#7C5CFF" opacity="0.9">
            <animateTransform attributeName="transform" type="rotate" values="0,0,0; 8,0,0; 0,0,0" dur="3s" repeatCount="indefinite"/>
          </path>
        </g>

        <!-- Eye -->
        <circle cx="515" cy="115" r="3.5" fill="#0A0F1F"/>
        <circle cx="516.5" cy="114" r="1.2" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>
