<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Vishwanath P H: Cybersecurity and Software Development</title>
  <desc id="desc">Animated banner with a cat wearing round glasses, a terminal-style introduction and rotating focus areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#10233F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D4FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E3354" stroke-width="1" opacity="0.55"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- falling binary columns -->
    <g fill="#00D4FF" opacity="0.28" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
      <text><tspan x="800" y="20">1</tspan><tspan x="800" y="40">0</tspan><tspan x="800" y="60">1</tspan><tspan x="800" y="80">0</tspan><tspan x="800" y="100">0</tspan><tspan x="800" y="120">0</tspan><tspan x="800" y="140">1</tspan><tspan x="800" y="160">0</tspan><tspan x="800" y="180">0</tspan><tspan x="800" y="200">0</tspan><tspan x="800" y="220">0</tspan><tspan x="800" y="240">1</tspan><tspan x="800" y="260">1</tspan><tspan x="800" y="280">0</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -290" to="0 290" dur="9s" begin="0.0s" repeatCount="indefinite"/>
    </g>
    <g fill="#00D4FF" opacity="0.28" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
      <text><tspan x="838" y="20">0</tspan><tspan x="838" y="40">0</tspan><tspan x="838" y="60">1</tspan><tspan x="838" y="80">0</tspan><tspan x="838" y="100">0</tspan><tspan x="838" y="120">0</tspan><tspan x="838" y="140">0</tspan><tspan x="838" y="160">1</tspan><tspan x="838" y="180">0</tspan><tspan x="838" y="200">0</tspan><tspan x="838" y="220">0</tspan><tspan x="838" y="240">0</tspan><tspan x="838" y="260">1</tspan><tspan x="838" y="280">1</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -290" to="0 290" dur="12s" begin="1.5s" repeatCount="indefinite"/>
    </g>
    <g fill="#00D4FF" opacity="0.28" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
      <text><tspan x="876" y="20">0</tspan><tspan x="876" y="40">0</tspan><tspan x="876" y="60">1</tspan><tspan x="876" y="80">0</tspan><tspan x="876" y="100">0</tspan><tspan x="876" y="120">0</tspan><tspan x="876" y="140">1</tspan><tspan x="876" y="160">0</tspan><tspan x="876" y="180">0</tspan><tspan x="876" y="200">0</tspan><tspan x="876" y="220">0</tspan><tspan x="876" y="240">1</tspan><tspan x="876" y="260">1</tspan><tspan x="876" y="280">1</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -290" to="0 290" dur="8s" begin="0.6s" repeatCount="indefinite"/>
    </g>
    <g fill="#00D4FF" opacity="0.28" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
      <text><tspan x="914" y="20">1</tspan><tspan x="914" y="40">1</tspan><tspan x="914" y="60">1</tspan><tspan x="914" y="80">1</tspan><tspan x="914" y="100">0</tspan><tspan x="914" y="120">0</tspan><tspan x="914" y="140">0</tspan><tspan x="914" y="160">0</tspan><tspan x="914" y="180">1</tspan><tspan x="914" y="200">1</tspan><tspan x="914" y="220">1</tspan><tspan x="914" y="240">1</tspan><tspan x="914" y="260">1</tspan><tspan x="914" y="280">0</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -290" to="0 290" dur="11s" begin="2.2s" repeatCount="indefinite"/>
    </g>
    <g fill="#00D4FF" opacity="0.28" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
      <text><tspan x="952" y="20">0</tspan><tspan x="952" y="40">1</tspan><tspan x="952" y="60">0</tspan><tspan x="952" y="80">1</tspan><tspan x="952" y="100">0</tspan><tspan x="952" y="120">1</tspan><tspan x="952" y="140">1</tspan><tspan x="952" y="160">0</tspan><tspan x="952" y="180">0</tspan><tspan x="952" y="200">1</tspan><tspan x="952" y="220">1</tspan><tspan x="952" y="240">1</tspan><tspan x="952" y="260">1</tspan><tspan x="952" y="280">1</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -290" to="0 290" dur="10s" begin="1.0s" repeatCount="indefinite"/>
    </g>

    <!-- scanning line -->
    <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
      <animate attributeName="y" from="-60" to="280" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- cat emblem with pulse rings -->
    <circle cx="190" cy="146" r="70" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0">
      <animate attributeName="r" values="70;110" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="146" r="70" fill="none" stroke="#7C5CFF" stroke-width="2" opacity="0">
      <animate attributeName="r" values="70;110" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(190 146)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- dark silhouette so the pulse rings do not show through the head -->
      <path fill="#0E1B33" stroke="none" d="M-59 6 C-60 -2 -57 -14 -56 -22 C-59 -32 -62 -46 -64 -60 C-65 -70 -62 -77 -56 -73 C-46 -66 -37 -55 -27 -47 C-18 -45 -9 -45 0 -45.5 C9 -45 18 -45 27 -47 C37 -55 46 -66 56 -73 C62 -77 65 -70 64 -60 C62 -46 59 -32 56 -22 C57 -14 60 -2 59 6 L61 42 C52 52 42 56 33 58 C28 60 27 66 18 71 C10 75 -10 75 -18 71 C-27 66 -28 60 -33 58 C-42 56 -52 52 -61 42 Z"/>

      <!-- head and ears -->
      <path stroke="#C9D6EE" stroke-width="2.4" d="M-59 6 C-60 -2 -57 -14 -56 -22 C-59 -32 -62 -46 -64 -60 C-65 -70 -62 -77 -56 -73 C-46 -66 -37 -55 -27 -47 C-18 -45 -9 -45 0 -45.5 C9 -45 18 -45 27 -47 C37 -55 46 -66 56 -73 C62 -77 65 -70 64 -60 C62 -46 59 -32 56 -22 C57 -14 60 -2 59 6"/>

      <!-- cheeks -->
      <path stroke="#C9D6EE" stroke-width="2" opacity="0.8" d="M-61 17 L-61.5 30 M61 17 L61.5 30"/>

      <!-- chin and neck ruff -->
      <path stroke="#C9D6EE" stroke-width="2.4" d="M-61 42 C-52 52 -42 56 -33 58 C-28 60 -27 66 -18 71 C-10 75 10 75 18 71 C27 66 28 60 33 58 C42 56 52 52 61 42"/>
      <path stroke="#C9D6EE" stroke-width="1.8" opacity="0.7" d="M-32 30 L-30 54 M35 30 L30 54"/>

      <!-- forehead marks -->
      <path stroke="#C9D6EE" stroke-width="1.6" opacity="0.6" d="M-31 -42 L-23 -36 M33 -33 Q46 -40 56 -45 M37 -26 Q44 -29 50 -32"/>

      <!-- whiskers -->
      <path stroke="#C9D6EE" stroke-width="1.4" opacity="0.65" d="M-62 36 L-80 31 M-62 42 L-82 42 M-62 48 L-80 54 M62 36 L80 31 M62 42 L82 42 M62 48 L80 54"/>

      <!-- round glasses -->
      <circle cx="-34" cy="3.5" r="20" stroke="url(#accent)" stroke-width="3"/>
      <circle cx="34" cy="3.5" r="20" stroke="url(#accent)" stroke-width="3"/>
      <path stroke="url(#accent)" stroke-width="3" d="M-14 0 Q0 -12 14 0"/>
      <path stroke="#C9D6EE" stroke-width="1.8" opacity="0.6" d="M-46 -3 A13 13 0 0 1 -38 -10 M22 -3 A13 13 0 0 1 30 -10"/>
    </g>

    <!-- terminal prompt with blinking cursor -->
    <text x="300" y="100" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#34D399">$ whoami</text>
    <rect x="391" y="85" width="10" height="19" fill="#34D399">
      <animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>

    <!-- name -->
    <text x="298" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="url(#accent)">Vishwanath P H</text>

    <!-- underline that draws itself in -->
   <rect x="300" y="184" width="0" height="3" rx="1.5" fill="url(#accent)">
  <animate attributeName="width" from="0" to="600" dur="1.4s" begin="0s" fill="freeze"/>
   </rect>

    <!-- rotating focus areas -->
    <text x="300" y="228" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" fill="#C9D6EE" opacity="0">
      &gt; Cybersecurity | Security Engineering
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="228" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" fill="#C9D6EE" opacity="0">
      &gt; Developer | Problem Solver
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="228" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" fill="#C9D6EE" opacity="0">
      &gt; Building secure digital systems
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
