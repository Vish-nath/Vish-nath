<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Cybersecurity &amp; Code Animation</title>
  <desc id="bannerDesc">Creative animated cyber security banner showing secure data flow and glowing lock vector.</desc>
  <defs>
    <linearGradient id="cyberBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="0.5" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#10233F"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <clipPath id="bannerClip"><rect width="1000" height="180" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect width="1000" height="180" fill="url(#cyberBg)"/>

    <!-- Grid lines -->
    <path d="M0 45 H1000 M0 90 H1000 M0 135 H1000" stroke="#1E3354" stroke-width="1" opacity="0.4"/>
    <path d="M200 0 V180 M400 0 V180 M600 0 V180 M800 0 V180" stroke="#1E3354" stroke-width="1" opacity="0.3"/>

    <!-- Glowing circuit lines moving -->
    <g fill="none" stroke="url(#neonGlow)" stroke-width="2" opacity="0.7">
      <path d="M 50 90 L 150 90 L 180 50 L 300 50">
        <animate attributeName="stroke-dasharray" values="0,300; 300,0" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M 700 130 L 820 130 L 850 90 L 950 90">
        <animate attributeName="stroke-dasharray" values="0,300; 300,0" dur="3.5s" begin="1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Floating Security Lock / Shield Node -->
    <g transform="translate(100, 90)">
      <circle cx="0" cy="0" r="32" fill="#0A0F1F" stroke="url(#neonGlow)" stroke-width="2.5">
        <animate attributeName="r" values="30;35;30" dur="3s" repeatCount="indefinite"/>
      </circle>
      <!-- Lock Icon -->
      <rect x="-10" y="-4" width="20" height="16" rx="3" fill="#00D4FF"/>
      <path d="M -7 -4 V -11 a 7 7 0 0 1 14 0 V -4" fill="none" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="3" r="2" fill="#0A0F1F"/>
    </g>

    <!-- Pulsing status text & creative security badges -->
    <text x="160" y="72" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#34D399" font-weight="700">
      &gt; SYSTEM_STATUS: SECURE [ACTIVE]
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </text>

    <!-- Rotating Security Focus Statements -->
    <text x="160" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">
      Engineering Resilient &amp; Secure Systems
    </text>

    <text x="160" y="142" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#00D4FF" opacity="0.9">
      &gt; Cryptography · Vulnerability Analysis · Defensive Architecture
    </text>

    <!-- Pulsing Cyber Dot on right -->
    <g transform="translate(900, 90)">
      <circle cx="0" cy="0" r="16" fill="#7C5CFF" opacity="0.3">
        <animate attributeName="r" values="12;28;12" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="8" fill="#00D4FF"/>
    </g>
  </g>
</svg>
